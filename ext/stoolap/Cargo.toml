[package]
name = "stoolap"
version = "0.5.0-beta.1"
edition = "2021"
authors = ["Stoolap Contributors"]
license = "Apache-2.0"
description = "Native Ruby driver for the Stoolap embedded SQL database"
repository = "https://github.com/stoolap/stoolap-ruby"
homepage = "https://stoolap.io"
publish = false

[lib]
name = "stoolap"
crate-type = ["cdylib"]

[dependencies]
stoolap = { git = "https://github.com/stoolap/stoolap", branch = "main", default-features = false, features = ["parallel", "jemalloc"] }
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
chrono = "0.4"

